import groovy.json.JsonSlurper

plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '1.0.0'
group = 'com.jeladastudios.feelthenature'
archivesBaseName = 'fts-feel-the-nature'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            // FT's Geology carries mixins; in the development world its refmap has to be read in official names.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            // One line a second of what the soundscape hears and plays, for the automated game test (tools/).
            property 'fts_feelthenature.trace', 'true'
            // The compatibility mixins (Tough As Nails); in the jar they are named in its manifest.
            arg '-mixin.config=fts_feelthenature.mixins.json'
            mods { fts_feelthenature { source sourceSets.main } }
        }
    }
}

repositories {
    mavenCentral()
    // FT's Geology itself: the jar its own build makes, copied into libs/. Compiled against and run beside, never shipped.
    flatDir { dirs 'libs' }
}

dependencies {
    // 47.4, as the user's modpack runs (47.4.10): Serene Seasons and Tough As Nails ask for 47.3 and some of the pack's
    // mods for 47.4. Nothing of 47.3 or 47.4 is used: the addon still runs on any 47 (mods.toml).
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.23'
    // Named ftn-core in libs, not fts-geology: ForgeGradle keeps the remapped copy in a cache every project shares, by
    // that name, and another project building against fts-geology overwrote it while a test game ran on it (4 Oct).
    implementation fg.deobf('blank:ftn-core:0.11.0')
    // Only in the development game, to try the seasons of the small life (client.life.SeasonBridge, which reads Serene
    // Seasons by reflection and needs nothing of it to build). Never shipped.
    if (file('libs/sereneseasons-9.1.0.3.jar').exists() && !project.hasProperty('noSeasons')) {
        runtimeOnly fg.deobf('blank:sereneseasons:9.1.0.3')
        runtimeOnly fg.deobf('blank:glitchcore:0.0.1.1')
        // And Tough As Nails, for the umbrella keeping its holder out of the rain (mixin.TanRainMixin).
        if (file('libs/toughasnails-9.2.0.171.jar').exists()) runtimeOnly fg.deobf('blank:toughasnails:9.2.0.171')
    }
    // Only in the development game, to try the AmbientSounds compatibility against the real thing. Never shipped.
    if (file('libs/ambientsounds-6.3.8.jar').exists() && !project.hasProperty('noAmbientSounds')) {
        runtimeOnly fg.deobf('blank:ambientsounds:6.3.8')
        runtimeOnly fg.deobf('blank:creativecore:2.12.40')
    }
    // With -Ppack, a slice of the user's modpack in the development game, for the game test against its worldgen: the
    // mods whose biome modifiers once fell between the addon's and crashed the game (Croptopia, HBM), Dynamic Trees,
    // Naturalist and Wildernature, with what they need, and Terralith, whose biomes the pack lays on FT's Geology's
    // terrain. Copied into libs/ by hand; never shipped.
    if (project.hasProperty('pack')) {
        ['croptopia:4.0.1', 'epherolib:1.2.0', 'hbm:2.0', 'architectury:9.2.14', 'clothconfig:11.1.136', 'geckolib:4.8.4',
         'dynamictrees:1.4.11', 'naturalist:5.0', 'wildernature:1.0.6', 'curios:5.14.1', 'terralith:2.5.4'].each { runtimeOnly fg.deobf("blank:${it}") }
    }
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

/*
 * The rules the data has to keep, checked on every build. Each was learnt from a crash or a silence:
 *  - every placed feature the addon adds belongs to exactly one biome, and every feature modifier targets a tag of one
 *    biome: a placed feature shared between biomes let other mods' modifiers fall between them in different orders, and
 *    the game crashed with "Feature order cycle" (twice on 2026-10-03);
 *  - no vanilla or other mod's placed feature is added directly, for the same reason;
 *  - every sound the soundscape names exists, and none is streamed: other mods fill the eight stream channels;
 *  - both languages carry the same keys;
 *  - every item model's own parents and textures exist, and every umbrella colour has its model, recipe, name and tag.
 */
tasks.register('validateData') {
    group = 'verification'
    description = 'Checks the data and sound rules the addon depends on.'
    def res = file('src/main/resources')
    inputs.dir(res)
    inputs.file('src/main/java/com/jeladastudios/feelthenature/client/sound/Layer.java')
    inputs.file('src/main/java/com/jeladastudios/feelthenature/client/sound/WaterVoices.java')
    doLast {
        def errors = []
        def json = new JsonSlurper()
        def ns = 'fts_feelthenature'
        def data = new File(res, "data/${ns}")
        // Every JSON file parses.
        fileTree(res) { include '**/*.json' }.each { f ->
            try { json.parse(f) } catch (e) { errors << "not valid JSON: ${res.toPath().relativize(f.toPath())}: ${e.message}" }
        }
        // Feature modifiers: one biome each, own placed features only, each placed feature used exactly once.
        def placedDir = new File(data, 'worldgen/placed_feature')
        def configuredDir = new File(data, 'worldgen/configured_feature')
        def tagDir = new File(data, 'tags/worldgen/biome')
        def used = [:].withDefault { 0 }
        def biomesTargeted = [:].withDefault { [] }
        new File(data, 'forge/biome_modifier').listFiles().findAll { it.name.endsWith('.json') }.each { f ->
            def m = json.parse(f)
            // Another mod's features taken out: through the addon's own tags, every entry optional, so the game loads
            // the same without that mod.
            if (m.type == 'forge:remove_features') {
                [biomes: 'tags/worldgen/biome', features: 'tags/worldgen/placed_feature'].each { key, dir ->
                    def ref = m[key]
                    if (!(ref instanceof String) || !ref.startsWith("#${ns}:")) { errors << "${f.name}: ${key} must be one of the addon's own tags, not ${ref}"; return }
                    def tag = new File(data, "${dir}/${ref.substring(ns.length() + 2)}.json")
                    if (!tag.exists()) { errors << "${f.name}: tag ${ref} does not exist"; return }
                    json.parse(tag).values.each { v ->
                        if (!(v instanceof Map) || v.required != false) errors << "${tag.name}: ${v} must be marked \"required\": false"
                    }
                }
                return
            }
            if (m.type != 'forge:add_features') return
            def biomes = m.biomes
            // A feature that belongs everywhere (the river banks) is added once, by one modifier, to the whole overworld;
            // its place among other mods' features is then the same in every biome. Everything else goes biome by biome.
            def broad = biomes == '#minecraft:is_overworld'
            if (!broad && (!(biomes instanceof String) || !biomes.startsWith("#${ns}:"))) {
                errors << "${f.name}: feature modifiers must target one of the addon's own one-biome tags or #minecraft:is_overworld, not ${biomes}"
                return
            }
            if (!broad) {
                def tag = new File(tagDir, biomes.substring(ns.length() + 2) + '.json')
                if (!tag.exists()) { errors << "${f.name}: tag ${biomes} does not exist"; return }
                def values = json.parse(tag).values
                if (values.size() != 1) errors << "${f.name}: tag ${biomes} holds ${values.size()} biomes, must hold exactly one"
                values.each { v -> biomesTargeted[(v instanceof Map ? v.id : v)] << f.name }
            }
            def features = m.features instanceof List ? m.features : [m.features]
            features.each { id ->
                if (!id.startsWith("${ns}:")) errors << "${f.name}: adds ${id}; only the addon's own placed features may be added"
                used[id] += 1
                if (!new File(placedDir, id.substring(ns.length() + 1) + '.json').exists()) errors << "${f.name}: placed feature ${id} does not exist"
            }
        }
        used.each { id, n -> if (n > 1) errors << "placed feature ${id} is added ${n} times; each must belong to one biome" }
        biomesTargeted.each { b, files -> if (files.size() > 1) errors << "biome ${b} is targeted by several feature modifiers: ${files}" }
        placedDir.listFiles().findAll { it.name.endsWith('.json') }.each { f ->
            def id = "${ns}:" + f.name - '.json'
            if (!used.containsKey(id)) errors << "placed feature ${id} is never added to a biome"
            def feature = json.parse(f).feature
            if (feature instanceof String && feature.startsWith("${ns}:") && !new File(configuredDir, feature.substring(ns.length() + 1) + '.json').exists()) {
                errors << "${f.name}: configured feature ${feature} does not exist"
            }
        }
        // Sounds: every layer named, every file there, nothing streamed.
        def soundsJson = new File(res, "assets/${ns}/sounds.json")
        def sounds = json.parse(soundsJson)
        sounds.each { event, def entry ->
            entry.sounds.each { s ->
                def name = s instanceof Map ? s.name : s
                def file = new File(res, "assets/${ns}/sounds/" + name.substring(name.indexOf(':') + 1) + '.ogg')
                if (!file.exists()) errors << "sounds.json ${event}: missing file ${file.name}"
                if (s instanceof Map && s.stream) errors << "sounds.json ${event}: streamed; the stream channels are not ours to fill"
            }
        }
        def layerSrc = file('src/main/java/com/jeladastudios/feelthenature/client/sound/Layer.java').text
        (layerSrc =~ /\("([a-z_]+)", Group\./).each { all, name ->
            if (!sounds.containsKey(name)) errors << "Layer ${name} has no entry in sounds.json"
        }
        // Water is heard from a place: its recordings must be mono, or OpenAL plays them from everywhere at once.
        def waterSrc = file('src/main/java/com/jeladastudios/feelthenature/client/sound/WaterVoices.java').text
        (waterSrc =~ /[A-Z]+\("([a-z_]+)", [0-9.]+f/).each { all, name ->
            if (!sounds.containsKey(name)) { errors << "water sound ${name} has no entry in sounds.json"; return }
            def ogg = new File(res, "assets/${ns}/sounds/${name}.ogg")
            if (!ogg.exists()) return
            byte[] head = new byte[256]
            ogg.withInputStream { it.read(head) }
            def text = new String(head, 'ISO-8859-1')
            int at = text.indexOf('\u0001vorbis')
            if (at < 0) errors << "${ogg.name}: not an Ogg Vorbis file"
            else if (head[at + 11] != 1) errors << "${ogg.name}: has ${head[at + 11]} channels; a sound heard from a place must be mono"
        }
        // Languages carry the same keys, and every subtitle is in them.
        def en = json.parse(new File(res, "assets/${ns}/lang/en_us.json")).keySet()
        def tr = json.parse(new File(res, "assets/${ns}/lang/tr_tr.json")).keySet()
        (en - tr).each { errors << "tr_tr lacks ${it}" }
        (tr - en).each { errors << "en_us lacks ${it}" }
        sounds.each { event, def entry -> if (entry.subtitle && !en.contains(entry.subtitle)) errors << "subtitle ${entry.subtitle} not in en_us" }
        // Item models: every parent and texture of ours they name exists, so nothing shows as the purple-and-black cube.
        def models = new File(res, "assets/${ns}/models/item")
        def ownRef = { String ref -> ref?.startsWith("${ns}:") ? ref.substring(ns.length() + 1) : null }
        fileTree(models) { include '*.json' }.each { f ->
            def checkModel
            checkModel = { m ->
                if (!(m instanceof Map)) return
                def p = ownRef(m.parent)
                if (p != null && !new File(res, "assets/${ns}/models/${p}.json").exists()) errors << "${f.name}: parent ${m.parent} does not exist"
                m.textures?.each { k, t ->
                    def tex = ownRef(t)
                    if (tex != null && !new File(res, "assets/${ns}/textures/${tex}.png").exists()) errors << "${f.name}: texture ${t} does not exist"
                }
                m.overrides?.each { o ->
                    def om = ownRef(o.model)
                    if (om != null && !new File(res, "assets/${ns}/models/${om}.json").exists()) errors << "${f.name}: override model ${o.model} does not exist"
                }
                checkModel(m.base)
                m.perspectives?.each { k, v -> checkModel(v) }
            }
            checkModel(json.parse(f))
        }
        // Every umbrella colour has its model, its recipe, its name in both languages, and a place in the umbrellas tag.
        def umbrellaTag = json.parse(new File(data, 'tags/items/umbrellas.json')).values
        ['white', 'orange', 'magenta', 'light_blue', 'yellow', 'lime', 'pink', 'gray', 'light_gray', 'cyan', 'purple',
         'blue', 'brown', 'green', 'red', 'black'].each { c ->
            def item = "umbrella_${c}"
            if (!new File(models, "${item}.json").exists()) errors << "${item} has no item model"
            def recipe = new File(data, "recipes/${item}.json")
            if (!recipe.exists()) errors << "${item} has no recipe"
            else if (json.parse(recipe).result?.item != "${ns}:${item}") errors << "recipe ${recipe.name} does not make ${item}"
            if (!en.contains("item.${ns}.${item}".toString())) errors << "${item} has no name in en_us"
            if (!umbrellaTag.contains("${ns}:${item}".toString())) errors << "${item} is not in the umbrellas tag"
        }
        // The AmbientSounds compatibility silences its rain and wind: each override plays nothing.
        fileTree(new File(res, 'assets/ambientsounds')) { include '**/*.json' }.each { f ->
            def o = json.parse(f)
            if (o.sounds == null || !o.sounds.isEmpty()) errors << "ambientsounds override ${f.name} must have an empty sounds list"
            if (o.'sound-collections') errors << "ambientsounds override ${f.name} must not name sound collections"
        }
        if (!errors.isEmpty()) throw new GradleException("Data rules broken:\n  " + errors.join('\n  '))
        logger.lifecycle("validateData: all rules hold (${used.size()} placed features, ${sounds.size()} sound events)")
    }
}
tasks.named('check') { dependsOn 'validateData' }

tasks.named('jar') {
    manifest {
        attributes([
            'Specification-Title'   : 'FT\'s Geology: Feel the Nature',
            'Specification-Vendor'  : 'Jelada Studios',
            'Specification-Version' : '1',
            'Implementation-Title'  : project.name,
            'Implementation-Version': project.version,
            'MixinConfigs'          : 'fts_feelthenature.mixins.json'
        ])
    }
    // The licence and the recordists' names go with the jar.
    from('LICENSE') { rename { 'LICENSE_fts_feelthenature' } }
    from('CREDITS-sounds.md')
    // One jar in build/libs, the build that just ran.
    doFirst {
        delete fileTree(layout.buildDirectory.dir('libs')) { include '*.jar' }
    }
}
