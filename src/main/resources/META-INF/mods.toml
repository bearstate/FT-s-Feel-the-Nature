[[mods]]
modId = "fts_feelthenature"
version = "${file.jarVersion}"
displayName = "FT's Geology: Feel the Nature"
authors = "Jelada Studios"
credits = "Sounds: see CREDITS-sounds.md. Every recording is CC0, from Freesound."
description = '''
The life on FT's Geology's ground: the weather heard as it falls where you stand, the wind in what grows round you,
and the country clothed the way its rock and climate would clothe it.
'''

[[dependencies.fts_feelthenature]]
