    ordering = "NONE"
    side = "BOTH"

[[dependencies.fts_feelthenature]]
    modId = "minecraft"
    mandatory = true
    versionRange = "[1.20.1,1.21)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.fts_feelthenature]]
    modId = "fts_geology"
    mandatory = true
    versionRange = "[0.11.0,)"
    ordering = "AFTER"
    side = "BOTH"

# Loaded after it so the compatibility pack can stand over its weather regions.
[[dependencies.fts_feelthenature]]
    modId = "ambientsounds"
    mandatory = false
    versionRange = "*"
